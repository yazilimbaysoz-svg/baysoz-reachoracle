# Baysöz Labs <baysozlabs@proton.me> — baysoz-reachoracle
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baysoz-reachoracle"
version = "1.0.0"
description = "Offline white-box Python vulnerability reachability oracle with deterministic SARIF CI gating by Baysöz Labs <baysozlabs@proton.me>"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Baysöz Labs", email = "baysozlabs@proton.me" }]
keywords = ["appsec", "redteam", "reachability", "sbom", "sarif", "supply-chain"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["packaging>=24.2"]

[project.scripts]
baysoz-reachoracle = "baysoz_reachoracle.cli:main"

[project.urls]
Homepage = "https://github.com/yazilimbaysoz-svg/baysoz-reachoracle"
Issues = "https://github.com/yazilimbaysoz-svg/baysoz-reachoracle/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/baysoz_reachoracle"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607"]
"tests/fixtures/**/*.py" = ["F401", "S506"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
